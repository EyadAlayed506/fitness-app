# Checks for every pull request into merged_branch and every push to it.
# Free: standard GitHub-hosted runners are free and unlimited for public repositories.
# No secrets are used or needed: tests replace WHOOP, USDA, Open Food Facts and the AI with fakes.
name: CI

on:
  pull_request:
    branches: [merged_branch]
  push:
    # merged_branch, plus Alzoman's work branch so checks run without opening a pull request
    branches: [merged_branch, alzoman, "alzoman/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml, instead of silently re-resolving
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -q

  mobile:
    name: Mobile (test, lint, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-node@v6
        with:
          # npm test uses --experimental-strip-types, which needs Node 22.6 or newer
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  web-app:
    name: Web app (export + served by the backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Build the web app
        working-directory: mobile
        run: |
          npm ci
          npx expo export -p web
          test -f dist/index.html
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install backend
        run: |
          python -m pip install --upgrade uv
          uv sync --locked
      - name: Start the backend and check it serves the app
        run: |
          uv run fastapi run app/main.py --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/ -o home.html
          grep -q "_expo/static/js" home.html
          curl -fsS http://127.0.0.1:8000/sleep | grep -q "_expo/static/js"
          script=$(grep -o '/_expo/static/js/[^"]*\.js' home.html | head -1)
          curl -fsS "http://127.0.0.1:8000$script" -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/nope)" = 404
          echo "Web app served correctly"
      - name: Server log
        if: always()
        run: cat server.log || true
